name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: ${{ matrix.workspace }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # CI has no GPU, so build the CPU backend only
          - workspace: plantvillage_ssl
            features: --no-default-features --features cpu
          - workspace: incremental_learning
            features: ""
    defaults:
      run:
        working-directory: ${{ matrix.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.workspace }}
      - name: Clippy
        run: cargo clippy --all-targets ${{ matrix.features }} -- -D warnings
      - name: Test
        run: cargo test ${{ matrix.features }}
