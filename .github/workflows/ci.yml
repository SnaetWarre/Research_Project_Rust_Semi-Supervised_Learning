name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: plantvillage_ssl
      - name: Check CPU build
        run: cargo check --manifest-path plantvillage_ssl/Cargo.toml --no-default-features --features cpu
