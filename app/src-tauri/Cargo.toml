[package]
name = "plantssl-app"
version = "0.2.0"
description = "Desktop app for classifying leaf photos and browsing training runs"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "plantssl_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
anyhow.workspace = true
image.workspace = true
# Classification runs on the CPU, like it would on an edge device
plantssl = { path = "../../plantssl", default-features = false }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"

[dev-dependencies]
tauri = { version = "2.12", features = ["test"] }
tempfile = "3"

[features]
# Live SSL trains on the GPU; build with --no-default-features for machines without CUDA
default = ["cuda"]
cuda = ["plantssl/cuda"]
# Set by the Tauri CLI for production builds
custom-protocol = ["tauri/custom-protocol"]

[lints]
workspace = true
